<div class="container">
  <h1>Votre panier</h1>

  <p *ngIf="cartService.lines().length === 0">Votre panier est vide.</p>

  <table *ngIf="cartService.lines().length > 0">
    <thead>
      <tr>
        <th>Produit</th>
        <th>Quantité</th>
        <th>Prix unitaire</th>
        <th>Sous-total</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let line of cartService.lines()">
        <td>{{ line.productName }}</td>
        <td>{{ line.quantity }}</td>
        <td>{{ line.unitPrice | number: '1.2-2' }} €</td>
        <td>{{ line.unitPrice * line.quantity | number: '1.2-2' }} €</td>
        <td><button class="remove" (click)="cartService.remove(line.productId)">✕</button></td>
      </tr>
    </tbody>
  </table>

  <p class="total" *ngIf="cartService.lines().length > 0">
    Total : <strong>{{ cartService.total() | number: '1.2-2' }} €</strong>
  </p>

  <div class="checkout" *ngIf="cartService.lines().length > 0">
    <input type="email" [(ngModel)]="email" placeholder="Votre email" />
    <button (click)="checkout()" [disabled]="submitting || !email">
      {{ submitting ? 'Envoi en cours…' : 'Valider la commande' }}
    </button>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
